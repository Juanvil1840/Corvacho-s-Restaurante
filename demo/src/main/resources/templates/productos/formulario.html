<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.id} ? 'Editar Producto' : 'Nuevo Producto'">Formulario Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
    <link rel="stylesheet" th:href="@{/style/landing.css}">
    <link rel="stylesheet" th:href="@{/style/producto-formulario.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="body-producto-form">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><img th:src="@{/Images/logo-simple.png}" height="60px"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link" href="/menu">MENU</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="producto-form-contenedor">
        <h1 class="producto-form-titulo" th:text="${producto.id} ? 'Editar Producto' : 'Nuevo Producto'"></h1>

        <div class="producto-form-tarjeta">
            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="producto-form-grupo">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" required>
                </div>

                <div class="producto-form-grupo">
                    <label>Precio</label>
                    <input type="number" step="0.01" th:field="*{precio}" required>
                </div>

                <div class="producto-form-grupo">
                    <label>Descripcion</label>
                    <textarea th:field="*{descripcion}" rows="3" required></textarea>
                </div>

                <div class="producto-form-grupo">
                    <label>URL o Ruta de Imagen</label>
                    <input type="text" th:field="*{imagen}" placeholder="https://... o /Images/comida.png" required>
                </div>

                <div class="producto-form-grupo">
                    <label>Categoria</label>
                    <select name="categoriaId" id="categoriaId" required>
                        <option value="">-- Seleccionar categoria --</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.id}"
                                th:text="${cat.nombre}"
                                th:selected="${producto.categoria != null and producto.categoria.id == cat.id}">Categoria</option>
                    </select>
                </div>

                <div class="producto-form-grupo">
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{disponible}">
                        Disponible
                    </label>
                </div>

                <div class="producto-form-acciones">
                    <button type="submit" class="producto-form-btn-guardar">Guardar</button>
                    <a href="/productos" class="producto-form-btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer id="footer">
        <div id="footer-main">
            <section id="footer-logo-col">
                <img th:src="@{/Images/logo-completo.png}" src="/Images/logo-completo.png" alt="Logo Corvacho's" id="footer-logo">
            </section>

            <section id="footer-contacto-col">
                <h4 id="footer-contacto-titulo">CONTÁCTANOS</h4>
                <p>&#128205; Sede Administrativa: Calle 40 #7-60 Bogotá Colombia</p>
                <p>&#9993; administrativo@corvachos.com</p>
                <p>&#128222; CEL: +300 913 4441</p>
            </section>

            <section id="footer-redes-col">
                <h4 id="footer-redes-titulo">SÍGUENOS</h4>
                <hr id="footer-redes-divider">
                <div id="footer-redes-iconos">
                    <span class="footer-icono"><i class="bi bi-instagram"></i></span>
                    <span class="footer-icono"><i class="bi bi-facebook"></i></span>
                    <span class="footer-icono"><i class="bi bi-whatsapp"></i></span>
                </div>
            </section>
        </div>
        <div id="footer-bottom">
            <small>&copy; 2026 Corvacho's Restaurante. Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
