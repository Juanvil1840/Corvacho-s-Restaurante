<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Corvacho's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
    <link rel="stylesheet" th:href="@{/style/landing.css}">
    <link rel="stylesheet" th:href="@{/style/registro.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="body-registro">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><img th:src="@{/Images/logo-simple.png}" height="60px"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link" href="/menu">MENÚ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal con fondo de edificio -->
    <section class="registro-fondo" 
             th:style="'background-image: linear-gradient(rgba(0,15,20,0.80), rgba(0,15,20,0.85)), url(' + @{/Images/Edificio.jpeg} + ');'">
        
        <div class="registro-contenedor">
            <div class="registro-tarjeta">
                <h1 class="registro-titulo">Crear Cuenta</h1>
                
                <form class="registro-formulario" th:action="@{/perfil/guardar}" th:object="${cliente}" method="post">
                    <div class="registro-grupo">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" placeholder="Tu nombre" required>
                    </div>
                    
                    <div class="registro-grupo">
                        <label>Apellido</label>
                        <input type="text" th:field="*{apellido}" placeholder="Tu apellido" required>
                    </div>
                    
                    <div class="registro-grupo">
                        <label>Correo</label>
                        <input type="email" th:field="*{correo}" placeholder="ej. correo@corvachos.com" required>
                    </div>
                    
                    <div class="registro-grupo">
                        <label>Contraseña</label>
                        <input type="password" th:field="*{contraseña}" placeholder="********" required>
                    </div>
                    
                    <div class="registro-grupo">
                        <label>Teléfono</label>
                        <input type="tel" th:field="*{telefono}" placeholder="+57 300 000 0000">
                    </div>
                    
                    <div class="registro-grupo">
                        <label>Dirección</label>
                        <input type="text" th:field="*{direccion}" placeholder="Calle 40 #7-60 Bogotá">
                    </div>
                    
                    <button type="submit" class="registro-btn">Registrarse</button>
                </form>
                
                <div class="registro-enlace">
                    ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-registro">
        <div class="footer-main">
            <div class="footer-col">
                <img th:src="@{/Images/logo-completo.png}" alt="Logo Corvacho's">
            </div>
            <div class="footer-col">
                <h4>CONTÁCTANOS</h4>
                <p>&#128205; Calle 40 #7-60 Bogotá</p>
                <p>&#9993; administrativo@corvachos.com</p>
                <p>&#128222; +300 913 4441</p>
            </div>
            <div class="footer-col">
                <h4>SÍGUENOS</h4>
                <div class="footer-iconos">
                    <span><i class="bi bi-instagram"></i></span>
                    <span><i class="bi bi-facebook"></i></span>
                    <span><i class="bi bi-whatsapp"></i></span>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <small>&copy; 2026 Corvacho's Restaurante. Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
