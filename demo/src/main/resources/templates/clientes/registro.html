<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Corvacho's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
    <link rel="stylesheet" th:href="@{/style/landing.css}">
    <link rel="stylesheet" th:href="@{/style/login.css}" href="/style/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/"><img th:src="@{/Images/logo-simple.png}" src="/Images/logo-simple.png" height="60px"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
            <a class="nav-link" th:href="@{/}">INICIO</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#contacto">CONTACTO</a>
            </li>
            <li class="nav-item">
            <a class="nav-link login" th:href="@{/login}">LOG IN</a>
            </li>
            <li class="nav-item">
            <a class="nav-link signup" th:href="@{/perfil/registro}">SIGN UP</a>
            </li>
        </ul>
        </div>
    </div>
    </nav>

    <section class="login-section">
        <form class="login-form" th:action="@{/perfil/guardar}" th:object="${cliente}" method="post">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" placeholder="Tu nombre" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" th:field="*{apellido}" placeholder="Tu apellido" required>

            <label for="correo">Correo Electronico</label>
            <input type="email" id="correo" th:field="*{correo}" placeholder="ej. correo@corvachos.com" required>

            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" th:field="*{contraseña}" placeholder="********" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" th:field="*{telefono}" placeholder="+57 300 000 0000">

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" th:field="*{direccion}" placeholder="Calle 40 #7-60 Bogotá">

            <button type="submit" class="login-btn">REGISTRARSE</button>

            <p class="login-registrate">
                ¿Ya tienes una cuenta? 
                <a th:href="@{/login}">Inicia sesión</a>
            </p>
        </form>
    </section>

    <!-- Footer -->
    <footer id="footer">
        <div id="footer-main">
            <div id="footer-logo-col">
                <img th:src="@{/Images/logo-completo.png}" src="/Images/logo-completo.png" alt="Logo Corvacho's" id="footer-logo">
            </div>

            <div id="footer-contacto-col">
                <h4 id="footer-contacto-titulo">CONTÁCTANOS</h4>
                <p>&#128205; Sede Administrativa: Calle 40 #7-60 Bogotá Colombia</p>
                <p>&#9993; administrativo@corvachos.com</p>
                <p>&#128222; CEL: +300 913 4441</p>
            </div>

            <div id="footer-redes-col">
                <h4 id="footer-redes-titulo">SÍGUENOS</h4>
                <hr id="footer-redes-divider">
                <div id="footer-redes-iconos">
                    <span class="footer-icono"><i class="bi bi-instagram"></i></span>
                    <span class="footer-icono"><i class="bi bi-facebook"></i></span>
                    <span class="footer-icono"><i class="bi bi-whatsapp"></i></span>
                </div>
            </div>
        </div>

        <div id="footer-bottom">
            <small>&copy; 2026 Corvacho's Restaurante. Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
