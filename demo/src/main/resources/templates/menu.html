<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu Corvacho's</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../style/styles.css">
    <link rel="stylesheet" href="../style/menu.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><img src="../Images/logo-simple.png" height="60px"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">COMIDAS</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <div class="menu-grid">
            <h1 class="menu-text1">Corvachos menu</h1>
            <div th:each="entry : ${productosPorCategoria}" class="categoria-seccion">

                
                <div class="categoria-header">
                    <hr class="linea-divisoria">
                    <h1 class="menu-text1" th:text="${entry.key}">Nombre de Categoría</h1>
                    <hr class="linea-divisoria">
                </div>

                <section class="tarjetas">
                    <article class="card" style="width: 18rem;" th:each="producto : ${entry.value}">
                        <img th:src="${producto.imagen}" class="card-img-top" th:alt="${producto.nombre}">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${producto.nombre}">Card title</h5>
                            <p class="card-text" th:text="'$ ' + ${#numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'COMMA')}">Precio</p>
                            <a th:href="@{/menu/detalle/{id}(id=${producto.id})}" class="btn btn-primary">Ver descripción</a>
                        </div>
                    </article>
                </section>
                
            </div>
            
        </div>
    </main>

    <footer id="footer">
        <div id="footer-main">
            <section id="footer-logo-col">
                <img th:src="@{/Images/logo-completo.png}" src="/Images/logo-completo.png" alt="Logo Corvacho's" id="footer-logo">
            </section>

            <section id="footer-contacto-col">
                <h4 id="footer-contacto-titulo">CONTÁCTANOS</h4>
                <p>&#128205; Sede Administrativa: Calle 40 #7-60 Bogotá Colombia</p>
                <p>&#9993; administrativo@corvachos.com</p>
                <p>&#128222; CEL: +300 913 4441</p>
            </section>

            <section id="footer-redes-col">
                <h4 id="footer-redes-titulo">SÍGUENOS</h4>
                <hr id="footer-redes-divider">
                <div id="footer-redes-iconos">
                    <span class="footer-icono"><i class="bi bi-instagram"></i></span>
                    <span class="footer-icono"><i class="bi bi-facebook"></i></span>
                    <span class="footer-icono"><i class="bi bi-whatsapp"></i></span>
                </div>
            </section>
        </div> 
        
        <div id="footer-bottom">
            <small>@ 2026 Corvacho's Restaurante. Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
