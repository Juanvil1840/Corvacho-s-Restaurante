<!--Página de menú-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu Corvacho's</title>
        <!-- Para bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">

    <link rel="stylesheet" href="../style/styles.css">
    <link rel="stylesheet" href="../style/menu.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <!--logo en navbar-->
        <a class="navbar-brand" href="/"><img src="../Images/logo-simple.png" height="60px"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
        <!--links navbar-->
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
            <a class="nav-link" href="#">BEBIDAS</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">COMIDAS</a>
            </li>
        </ul>
        </div>
    </div>
    </nav>


    <div class="menu-grid">
    <h1 class="menu-text1">Platos Fuertes</h1>

    <div class="tarjetas">
        <div class="card" style="width: 18rem;" th:each="producto : ${productos}">
            <img th:src="${producto.imagen}" class="card-img-top" th:alt="${producto.nombre}">
            <div class="card-body">
                <h5 class="card-title" th:text="${producto.nombre}">Card title</h5>
                <p class="card-text" th:text="'$ ' + ${producto.precio}">Precio</p>
                <a href="#" class="btn btn-primary">Ver descripción</a>
            </div>
        </div>
    </div>

</div>



    
</body>
<!--Para Bootstrap-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
crossorigin="anonymous"></script>
</html>
