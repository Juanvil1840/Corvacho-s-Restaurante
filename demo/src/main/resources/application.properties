spring.application.name=demo
# En Render el puerto llega en la variable PORT; en local sigue siendo 8090
server.port=${PORT:8090}

#datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
#nombre base de datos
spring.datasource.url=jdbc:h2:file:./mydatabase
spring.datasource.username=sa
spring.datasource.password=

#consola de administracion de h2
spring.h2.console.enabled=true
#localhost:8090/h2
spring.h2.console.path=/h2

# Datos de prueba
spring.jpa.generate-ddl=true
#Actualizar esquema sin borrar datos
spring.jpa.hibernate.ddl-auto=update
#spring.sql.init.mode=

# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#imprime los parametros de las querys (muestra contrasenas, por eso esta apagado)
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true

# DevTools: tiempo de espera para que VS Code termine de compilar antes de reiniciar
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# Seguridad JWT
# Clave para firmar los tokens (Base64, minimo 64 bytes para HS512) y duracion del token en milisegundos (1 hora)
jwt.secret=lEQK/wt4+YbOYmntLFJor1ggoo+CpFFX/U8hyLHM6qDj+d+IJnT8hf/j3Moxjvbg8VL81pVd9pTwYE5eor2LEQ==
jwt.expiration=3600000

# Datos de demostracion: historial de pedidos de los ultimos 180 dias para el dashboard de reportes
# (se genera solo una vez, cuando la base tiene pocos pedidos). Poner en false para no generarlo
app.demo.historial=true

# Paginas que pueden usar el API (CORS). En Render se define CORS_ORIGINS con la URL de Vercel
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
