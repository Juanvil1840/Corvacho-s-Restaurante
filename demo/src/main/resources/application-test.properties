# Perfil "test": se activa con @ActiveProfiles("test") en las pruebas E2E con Selenium.
# Usa una base H2 en memoria para que cada prueba arranque con los datos del DataLoader
# y no toque la base de archivo ./mydatabase que se usa en desarrollo.
server.port=8090

spring.datasource.url=jdbc:h2:mem:corvachos_test
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Menos ruido en la consola durante las pruebas
logging.level.org.hibernate.SQL=WARN
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
