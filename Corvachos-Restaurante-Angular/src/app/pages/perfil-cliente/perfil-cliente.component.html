<div class="body-perfil">
  @if (cliente) {
    <app-perfil-info
      [cliente]="cliente"
      (eliminar)="eliminarCuenta()"
      (cerrar)="cerrarSesion()">
    </app-perfil-info>

    <app-perfil-pedidos [clienteId]="cliente.clienteId"></app-perfil-pedidos>
  } @else if (!cargando) {
    <section class="perfil-seccion-info" style="text-align: center; padding-top: 60px;">
      <div class="perfil-fondo-info" style="justify-content: center; flex-direction: column; gap: 16px;">
        <h2 class="perfil-titulo-info">Sesión no encontrada</h2>
        <p style="color: #fcfafa;">Por favor inicia sesión nuevamente para acceder a tu perfil y pedidos.</p>
        <a routerLink="/login" class="perfil-btn-editar" style="max-width: 240px;">Ir a Iniciar Sesión</a>
      </div>
    </section>
  }
</div>
