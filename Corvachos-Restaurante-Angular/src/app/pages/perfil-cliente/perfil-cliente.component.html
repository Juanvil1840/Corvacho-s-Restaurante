<div class="body-perfil" *ngIf="cliente">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <img src="assets/Images/logo-simple.png" height="60px">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">INICIO</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/menu">MENU</a></li>
          <li class="nav-item"><a class="nav-link" [routerLink]="['/clientes/perfil', cliente.clienteId]">PERFIL</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <app-perfil-info [cliente]="cliente" (eliminar)="eliminarCuenta()"></app-perfil-info>

  <app-perfil-pedidos [clienteId]="cliente.clienteId"></app-perfil-pedidos>

</div>
