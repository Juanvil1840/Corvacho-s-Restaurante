<div class="body-editar">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <img src="assets/Images/logo-simple.png" height="60px">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">INICIO</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/clientes">CLIENTES</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="editar-contenedor">
    <h1 class="editar-titulo">{{ editando ? 'Editar Perfil' : 'Nuevo Cliente' }}</h1>

    <div class="editar-tarjeta">
      <form (ngSubmit)="guardar()">

        <div class="editar-grupo">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="cliente.nombre" name="nombre" required>
        </div>

        <div class="editar-grupo">
          <label>Apellido</label>
          <input type="text" [(ngModel)]="cliente.apellido" name="apellido" required>
        </div>

        <div class="editar-grupo">
          <label>Correo</label>
          <input type="email" [(ngModel)]="cliente.correo" name="correo" required>
        </div>

        <div class="editar-grupo">
          <label>Contrasena</label>
          <input type="password" [(ngModel)]="cliente.contrasena" name="contrasena" placeholder="Nueva contrasena" required>
        </div>

        <div class="editar-grupo">
          <label>Telefono</label>
          <input type="tel" [(ngModel)]="cliente.telefono" name="telefono">
        </div>

        <div class="editar-grupo">
          <label>Direccion</label>
          <input type="text" [(ngModel)]="cliente.direccion" name="direccion">
        </div>

        <div class="editar-grupo" style="display: flex; align-items: center; gap: 10px;">
          <label style="margin: 0;">Cuenta activa</label>
          <input type="checkbox" [(ngModel)]="cliente.activo" name="activo" style="width: auto; transform: scale(1.3);">
        </div>

        <div class="editar-acciones">
          <button type="submit" class="editar-btn editar-btn-guardar">Guardar</button>
          <button type="button" class="editar-btn editar-btn-cancelar" (click)="cancelar()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>


</div>
