<div class="body-operador-lista">
  <div class="operador-lista-contenedor">

    <!-- Encabezado: título y botón -->
    <div class="operador-lista-encabezado">
      <h1 class="operador-lista-titulo">Operadores</h1>

      <a
        routerLink="/operadores/nuevo"
        class="operador-lista-btn-nuevo">
        <i class="bi bi-person-plus-fill"></i>
        Crear Operador
      </a>
    </div>

    @if (cargando) {
      <p class="operador-lista-mensaje">
        Cargando operadores...
      </p>
    }

    @if (error) {
      <p class="operador-lista-error">{{ error }}</p>
    }

    @if (!cargando && !error) {
      <app-operador-tabla
        [operadores]="operadores"
        (eliminar)="eliminarOperador($event)">
      </app-operador-tabla>
    }

  </div>
</div>
