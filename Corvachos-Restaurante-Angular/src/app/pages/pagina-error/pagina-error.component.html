<div class="container-error" style="background-color: #001c2a; color: #fcfafa;">
  <div class="container text-center py-5">
    
    <!-- Subcomponente que muestra el icono, titulo y mensaje -->
    <app-error-mensaje [mensaje]="mensaje"></app-error-mensaje>

    <!-- Botones de accion (se quedan en la pagina principal) -->
    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
      <a routerLink="/productos" class="productos-btn-nuevo" style="text-decoration: none;">
        Volver a productos
      </a>
      <a routerLink="/" class="productos-btn-nuevo" style="text-decoration: none; background: #264653;">
        Volver al inicio
      </a>
    </div>
    
  </div>
</div>
