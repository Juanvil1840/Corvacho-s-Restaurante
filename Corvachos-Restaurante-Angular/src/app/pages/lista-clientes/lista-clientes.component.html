<div class="body-productos">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <img src="assets/Images/logo-simple.png" height="60px">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">INICIO</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/clientes">CLIENTES</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="productos-contenedor">
    <h1 class="productos-titulo"><i class="bi bi-people-fill"></i> Gestion de Clientes</h1>

    <a routerLink="/clientes/nuevo" class="productos-btn-nuevo">+ Nuevo Cliente</a>

    <div class="productos-tabla">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Telefono</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cliente of clientes">
            <td>{{ cliente.clienteId }}</td>
            <td>{{ cliente.nombre }} {{ cliente.apellido }}</td>
            <td>{{ cliente.correo }}</td>
            <td>{{ cliente.telefono }}</td>
            <td>
              <span *ngIf="cliente.activo" class="productos-disponible">Activo</span>
              <span *ngIf="!cliente.activo" class="productos-no-disponible">Inactivo</span>
            </td>
            <td>
              <div class="productos-acciones">
                <a [routerLink]="['/clientes/perfil', cliente.clienteId]" class="productos-btn-editar">Ver</a>
                <a [routerLink]="['/clientes/editar', cliente.clienteId]" class="productos-btn-editar">Editar</a>
                <button (click)="eliminarCliente(cliente.clienteId)" class="productos-btn-eliminar">Eliminar</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
