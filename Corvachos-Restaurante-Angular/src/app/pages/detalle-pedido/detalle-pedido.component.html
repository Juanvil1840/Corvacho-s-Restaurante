<div class="pedidos-body">
  <main class="pedidos-container">

    <button type="button" (click)="volver()" class="btn-volver">
      <i class="bi bi-arrow-left"></i> Volver
    </button>

    @if (cargando) {
      <p class="pedido-lista-mensaje">Cargando detalle del pedido...</p>
    }

    @if (error) {
      <p class="pedido-lista-error">{{ error }}</p>
    }

    @if (!cargando && pedido) {
      
      <!-- Subcomponente de Cabecera (Fechas, Estado y Cliente) -->
      <app-pedido-cabecera [pedido]="pedido"></app-pedido-cabecera>

      <!-- Subcomponente de Tabla de Productos y Total -->
      <app-pedido-productos [detalles]="detalles"></app-pedido-productos>

    }
  </main>
</div>
